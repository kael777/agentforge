name: AgentForge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod sets the floor (go 1.26.10); using the latest patch here means
          # standard library fixes are picked up without editing the workflow.
          go-version: "1.26.x"
          cache-dependency-path: backend/api/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/api ./cmd/migrate

  realtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/ws/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/ws

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run check
      # Only runtime dependencies gate the build. Advisories in build tooling are
      # reviewed separately instead of failing unrelated pull requests.
      - run: npm audit --omit=dev --audit-level=high

  # Dependency vulnerabilities that are actually reachable from this code.
  # govulncheck reports only call paths it can prove; "1 module affected but not
  # called" is information, not a failure.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/api/go.sum
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan API module
        working-directory: backend/api
        run: govulncheck ./...
      - name: Scan realtime module
        working-directory: backend/ws
        run: govulncheck ./...

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f devops/docker/docker-compose.yml config
      # Building here is what catches a broken Dockerfile or a missing build
      # argument before a tag does.
      - run: docker compose -f devops/docker/docker-compose.yml build
