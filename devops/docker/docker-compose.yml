services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agentforge
      MYSQL_USER: agentforge
      MYSQL_PASSWORD: agentforge
      MYSQL_ROOT_PASSWORD: root-agentforge
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uagentforge -pagentforge --silent"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Bound to loopback on a non-default host port: the host may already run its
    # own MySQL on 3306, and a database port should never listen on every
    # interface just because a container asked for it.
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  migrate:
    build:
      context: ../../backend/api
      dockerfile: ../../devops/docker/api.Dockerfile
    entrypoint: ["/app/migrate"]
    environment: &app-env
      APP_ENV: development
      SERVICE_NAME: agentforge-api
      HTTP_ADDR: :55555
      # Inside the container the management listener binds all interfaces, but
      # the port is never published, so it stays on the container network.
      MANAGEMENT_ADDR: :55556
      MANAGEMENT_ALLOW_NON_LOOPBACK: "true"
      HTTP_ALLOWED_ORIGINS: http://localhost:5173
      DATABASE_DSN: "agentforge:agentforge@tcp(mysql:3306)/agentforge?charset=utf8mb4&parseTime=True&loc=UTC"
      DATABASE_MAX_IDLE_CONNS: 5
      DATABASE_MAX_OPEN_CONNS: 20
      DATABASE_CONN_MAX_LIFETIME: 1h
      JWT_SECRET: local-development-secret-at-least-32-characters
      JWT_ISSUER: agentforge-api
      JWT_AUDIENCE: agentforge-web
      JWT_TTL: 24h
      WS_TICKET_SECRET: local-ws-ticket-secret-at-least-32-characters
      WS_TICKET_ISSUER: agentforge-api
      WS_TICKET_AUDIENCE: agentforge-ws
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 10s
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../backend/api
      dockerfile: ../../devops/docker/api.Dockerfile
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "55555:55555"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:55555/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The realtime service has no database dependency, so it does not wait for
  # migration. It only needs the same ticket secret as the API.
  ws:
    build:
      context: ../../backend/ws
      dockerfile: ../../devops/docker/ws.Dockerfile
    environment:
      APP_ENV: development
      SERVICE_NAME: agentforge-ws
      WS_ADDR: :8090
      WS_MANAGEMENT_ADDR: :8091
      WS_MANAGEMENT_ALLOW_NON_LOOPBACK: "true"
      WS_ALLOWED_ORIGINS: http://localhost:5173
      WS_TICKET_SECRET: local-ws-ticket-secret-at-least-32-characters
      WS_TICKET_ISSUER: agentforge-api
      WS_TICKET_AUDIENCE: agentforge-ws
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 20s
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:

