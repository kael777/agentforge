upstream agentforge_api {
    server 127.0.0.1:55555;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # React + Vite build output. Change this path to your actual dist directory.
    root /srv/agentforge/current/web/dist;
    index index.html;

    location = /healthz {
        proxy_pass http://agentforge_api;
        include proxy_params;
    }

    location = /readyz {
        proxy_pass http://agentforge_api;
        include proxy_params;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://agentforge_api;
    }

    # Let React Router handle routes that are not real files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
