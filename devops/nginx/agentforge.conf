upstream agentforge_api {
    server 127.0.0.1:55555;
    keepalive 32;
}

upstream agentforge_ws {
    server 127.0.0.1:8090;
}

# The WebSocket ticket travels in the query string, so the /ws location logs the
# URI without it. $request would copy the ticket into a file that is far less
# protected than the application log.
log_format ws_no_query '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # Hides the Nginx version from error pages and the Server header. This is
    # not a security control by itself, but it removes a free version hint.
    server_tokens off;
    # Drops the framework header if an upstream ever sends one.
    proxy_hide_header X-Powered-By;

    # React + Vite build output. Change this path to your actual dist directory.
    root /srv/agentforge/current/web/dist;
    index index.html;

    # Public liveness only. /readyz, /version and /metrics are served on the
    # loopback management listeners (55556 for the API, 8091 for realtime) and
    # must never be proxied.
    location = /healthz {
        proxy_pass http://agentforge_api;
        include proxy_params;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://agentforge_api;
    }

    location /ws {
        access_log /var/log/nginx/agentforge-ws.access.log ws_no_query;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections are long lived. The default 60s read timeout
        # would cut every idle connection; heartbeats keep activity flowing but
        # the timeout still has to allow for quiet periods.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        proxy_pass http://agentforge_ws;
    }

    # Let React Router handle routes that are not real files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
