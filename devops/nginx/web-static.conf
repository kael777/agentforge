# Static SPA host for the built React bundle.
#
# Runs inside nginxinc/nginx-unprivileged (uid 101, listens on 8080), so the
# container never needs root and never needs to bind a privileged port.
server {
    listen 8080;
    server_name _;

    # Keeps the exact nginx version out of error pages and the Server header.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # The container itself proves it is serving; no backend required. This is
    # what the frontend template promises: /healthz must not depend on the API.
    location = /healthz {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok"}';
    }

    # Content-hashed assets can be cached forever; the entry document must not be,
    # otherwise a deploy keeps serving the previous bundle.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    }

    # Client-side routing: unknown paths return the app shell, not a 404 page.
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
